name: Build and release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Windows x64 をビルドする"
        required: true
        type: boolean
        default: true
      build_macos:
        description: "macOS arm64 をビルドする"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"

jobs:
  metadata:
    name: Build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
    steps:
      - name: Validate manual build targets
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.build_windows != true &&
          inputs.build_macos != true
        shell: bash
        run: |
          echo "Select at least one build target: Windows x64 or macOS arm64." >&2
          exit 1

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: metadata
        name: Calculate version and build number
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            base_version="${GITHUB_REF_NAME#v}"
            release_tag="${GITHUB_REF_NAME}"
            is_prerelease="false"
          else
            latest_stable_tag=""
            while IFS= read -r candidate; do
              if [[ "${candidate}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                latest_stable_tag="${candidate}"
                break
              fi
            done < <(git tag --sort=-version:refname)

            if [[ -z "${latest_stable_tag}" ]]; then
              echo "No stable vMAJOR.MINOR.FIX tag was found." >&2
              exit 1
            fi

            base_version="${latest_stable_tag#v}"
            is_prerelease="true"
          fi

          if [[ ! "${base_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported base version: ${base_version}" >&2
            exit 1
          fi

          build_number="$(bash .github/scripts/calculate-build-number.sh "${GITHUB_SHA}")"
          if [[ "${build_number}" -le 0 ]]; then
            echo "The calculated build number is invalid: ${build_number}" >&2
            exit 1
          fi

          if [[ "${is_prerelease}" == "true" ]]; then
            IFS='.' read -r version_major version_minor version_patch <<< "${base_version}"
            next_patch=$((10#${version_patch} + 1))
            version="${version_major}.${version_minor}.${next_patch}-SNAPSHOT_${build_number}"
            release_tag="v${version}"
          else
            version="${base_version}+${build_number}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${build_number}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease=${is_prerelease}" >> "${GITHUB_OUTPUT}"
          echo "Build version: ${version}"
          echo "Release tag: ${release_tag}"

  windows:
    name: Windows x64
    needs: metadata
    if: github.event_name != 'workflow_dispatch' || inputs.build_windows
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtmultimedia
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          $compilerPath = Join-Path $env:IQTA_TOOLS "mingw1310_64/bin/g++.exe"
          if (-not (Test-Path $compilerPath)) {
            throw "Qt MinGW 13.1 compiler was not found under $env:IQTA_TOOLS"
          }
          $compiler = (Resolve-Path $compilerPath).Path.Replace('\', '/')

          Write-Output "C++ compiler: $compiler"
          cmake -S app -B build/windows -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_CXX_COMPILER=$compiler" `
            "-DDISCORDVIDEO_VERSION=$env:VERSION"

      - name: Build
        run: cmake --build build/windows --config Release --parallel

      - name: Package application and FFmpeg
        shell: pwsh
        run: |
          & .github/scripts/package-windows.ps1 `
            -Version $env:VERSION `
            -OutputDirectory '${{ runner.temp }}/release-assets'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed with exit code $LASTEXITCODE"
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          & .github/scripts/build-windows-installer.ps1 `
            -Version $env:VERSION `
            -PackageDirectory '${{ runner.temp }}/package/DiscordVideo' `
            -OutputDirectory '${{ runner.temp }}/release-assets'

      - name: Upload Windows asset
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            ${{ runner.temp }}/release-assets/*.zip
            ${{ runner.temp }}/release-assets/*.exe
          if-no-files-found: error

  macos:
    name: macOS arm64
    needs: metadata
    if: github.event_name != 'workflow_dispatch' || inputs.build_macos
    runs-on: macos-14
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - id: ffmpeg-cache-key
        name: Calculate FFmpeg source cache key
        shell: bash
        run: |
          source_fingerprint="$({
            shasum -a 256 .github/scripts/ffmpeg-macos-versions.env
            shasum -a 256 .github/scripts/build-ffmpeg-macos.sh
          } | shasum -a 256 | awk '{print $1}')"
          echo "key=discordvideo-ffmpeg-macos14-arm64-${source_fingerprint}" \
            >> "${GITHUB_OUTPUT}"

      - id: ffmpeg-cache
        name: Restore compiled FFmpeg cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/discordvideo-ffmpeg-cache/macos-arm64
          key: ${{ steps.ffmpeg-cache-key.outputs.key }}

      - id: ffmpeg-cache-validation
        name: Validate compiled FFmpeg cache
        shell: bash
        run: |
          if bash .github/scripts/build-ffmpeg-macos.sh --validate \
              "${RUNNER_TEMP}/discordvideo-ffmpeg-cache/macos-arm64"; then
            echo "valid=true" >> "${GITHUB_OUTPUT}"
            echo "A valid compiled FFmpeg cache will be used."
          else
            echo "valid=false" >> "${GITHUB_OUTPUT}"
            echo "FFmpeg will be rebuilt from its pinned sources."
          fi

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Install FFmpeg build tools
        if: steps.ffmpeg-cache-validation.outputs.valid != 'true'
        run: brew install nasm pkgconf

      - name: Build FFmpeg from source
        if: steps.ffmpeg-cache-validation.outputs.valid != 'true'
        run: >-
          bash .github/scripts/build-ffmpeg-macos.sh
          "${RUNNER_TEMP}/discordvideo-ffmpeg-cache/macos-arm64"

      - name: Configure
        run: >-
          cmake -S app -B build/macos -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DDISCORDVIDEO_VERSION=${VERSION}

      - name: Build
        run: cmake --build build/macos --config Release --parallel

      - name: Deploy Qt runtime
        run: >-
          macdeployqt build/macos/DiscordVideo.app
          -qmldir=app/qml
          -always-overwrite
          -verbose=1

      - name: Package application and FFmpeg
        run: |
          bash .github/scripts/package-macos.sh \
            "${VERSION}" \
            "${RUNNER_TEMP}/release-assets" \
            "${RUNNER_TEMP}/discordvideo-ffmpeg-cache/macos-arm64"

      - name: Upload macOS asset
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: ${{ runner.temp }}/release-assets/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [metadata, windows, macos]
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
      IS_PRERELEASE: ${{ needs.metadata.outputs.is_prerelease }}
      HAS_WINDOWS_ASSET: ${{ needs.windows.result == 'success' }}
      HAS_MACOS_ASSET: ${{ needs.macos.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          if [[ "${HAS_WINDOWS_ASSET}" == "true" ]]; then
            test -f "release-assets/Windows-x64_v${VERSION}.zip"
            test -f "release-assets/Windows-x64-Setup_v${VERSION}.exe"
          fi
          if [[ "${HAS_MACOS_ASSET}" == "true" ]]; then
            test -f "release-assets/macOS-arm64_v${VERSION}.zip"
          fi

      - name: Create GitHub Release
        shell: bash
        run: |
          tag="${RELEASE_TAG}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          {
            echo "DiscordVideo v${VERSION}"
            echo
            if [[ "${HAS_WINDOWS_ASSET}" == "true" ]]; then
              echo "- Windows x64 portable ZIP (Qt runtime and BtbN GPL FFmpeg included)"
              echo "- Windows x64 installer"
            fi
            if [[ "${HAS_MACOS_ASSET}" == "true" ]]; then
              echo "- macOS arm64 (Qt runtime and GPL FFmpeg included)"
            fi
          } > "${notes_file}"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            release_flags=()
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              release_flags+=(--prerelease)
            fi
            gh release edit "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${tag}" \
              --notes-file "${notes_file}" \
              "${release_flags[@]}"
          else
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              gh release create "${tag}" \
                release-assets/* \
                --repo "${GITHUB_REPOSITORY}" \
                --target "${GITHUB_SHA}" \
                --prerelease \
                --title "${tag}" \
                --notes-file "${notes_file}"
            else
              gh release create "${tag}" \
                release-assets/* \
                --repo "${GITHUB_REPOSITORY}" \
                --verify-tag \
                --title "${tag}" \
                --notes-file "${notes_file}"
            fi
          fi
