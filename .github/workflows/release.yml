name: Build and release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  QT_VERSION: "6.8.3"

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: metadata
        name: Calculate version and build number
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Unsupported tag: ${tag}" >&2
            exit 1
          fi

          version="${tag#v}"
          build_number="$(bash .github/scripts/calculate-build-number.sh "${GITHUB_SHA}")"
          if [[ "${build_number}" -le 0 ]]; then
            echo "The calculated build number is invalid: ${build_number}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${build_number}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${version}+${build_number}"

  windows:
    name: Windows x64
    needs: metadata
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtmultimedia
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          $compilerPath = Join-Path $env:IQTA_TOOLS "mingw1310_64/bin/g++.exe"
          if (-not (Test-Path $compilerPath)) {
            throw "Qt MinGW 13.1 compiler was not found under $env:IQTA_TOOLS"
          }
          $compiler = (Resolve-Path $compilerPath).Path.Replace('\', '/')

          Write-Output "C++ compiler: $compiler"
          cmake -S app -B build/windows -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_CXX_COMPILER=$compiler" `
            "-DDISCORDVIDEO_VERSION=$env:VERSION"

      - name: Build
        run: cmake --build build/windows --config Release --parallel

      - name: Package application and FFmpeg
        shell: pwsh
        run: |
          & .github/scripts/package-windows.ps1 `
            -Version $env:VERSION `
            -BuildNumber $env:BUILD_NUMBER `
            -OutputDirectory '${{ runner.temp }}/release-assets'

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ runner.temp }}/release-assets/*.zip
          if-no-files-found: error

  macos:
    name: macOS arm64
    needs: metadata
    runs-on: macos-14
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Install FFmpeg build tools
        run: brew install nasm pkgconf

      - name: Configure
        run: >-
          cmake -S app -B build/macos -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DDISCORDVIDEO_VERSION=${VERSION}

      - name: Build
        run: cmake --build build/macos --config Release --parallel

      - name: Deploy Qt runtime
        run: >-
          macdeployqt build/macos/DiscordVideo.app
          -qmldir=app/qml
          -always-overwrite
          -verbose=1

      - name: Package application and FFmpeg
        run: |
          bash .github/scripts/package-macos.sh \
            "${VERSION}" \
            "${BUILD_NUMBER}" \
            "${RUNNER_TEMP}/release-assets"

      - name: Upload macOS asset
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: ${{ runner.temp }}/release-assets/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [metadata, windows, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.metadata.outputs.version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          test -f "release-assets/Windows-x64_v${VERSION}+${BUILD_NUMBER}.zip"
          test -f "release-assets/macOS-arm64_v${VERSION}+${BUILD_NUMBER}.zip"

      - name: Create GitHub Release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          {
            echo "DiscordVideo v${VERSION}+${BUILD_NUMBER}"
            echo
            echo "- Windows x64 (Qt runtime and BtbN GPL FFmpeg included)"
            echo "- macOS arm64 (Qt runtime and GPL FFmpeg included)"
            echo
            echo "BUILDNUM is the cumulative number of added lines in commits reachable from this tag."
          } > "${notes_file}"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-assets/*.zip \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${tag}" \
              --notes-file "${notes_file}"
          else
            gh release create "${tag}" \
              release-assets/*.zip \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${tag}" \
              --notes-file "${notes_file}"
          fi
